<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F5D56" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#101819" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mój Najem" />
  <meta name="format-detection" content="telephone=no" />
  <title>Mój Najem — Ewidencja nieruchomości</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Nawigacja główna">
      <div class="brand">
        <img src="./icons/favicon.svg" alt="" class="brand-logo" width="36" height="36" />
        <div>
          <div class="brand-title">Mój Najem</div>
          <div class="brand-sub">Lokalny rejestr najmu</div>
        </div>
      </div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="sidebar-footer" id="sidebarStatus"></div>
    </aside>

    <div class="main-column">
      <header class="topbar" id="topbar">
        <div class="topbar-left" id="topbarLeft"></div>
        <div class="topbar-right" id="topbarRight"></div>
      </header>

      <div id="demoBanner" class="demo-banner hidden"></div>

      <main class="content" id="mainContent" tabindex="-1">
        <div class="loading-state">
          <div class="spinner" aria-hidden="true"></div>
          <p>Wczytywanie lokalnej bazy danych…</p>
        </div>
      </main>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Dolne menu"></nav>
  </div>

  <div id="modalRoot" class="modal-root" aria-live="polite"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
